version: "v0.4"

project:
  name: Group Theory
  description: >-
    Every topological group has a Hausdorff, totally disconnected quotient
    by its identity component, without separation or local compactness of
    the original group. Continuous homomorphisms to totally disconnected
    groups equipped with a topology factor uniquely through this quotient;
    the target operations need not be continuous.

    Every identity neighborhood in a locally compact totally disconnected
    topological group contains a compact open subgroup. The open left-translation
    stabilizer of any compact open set provides the construction; compactness
    of that subgroup follows when the set contains the identity.

    For a continuous homomorphism from a nonarchimedean group, a subgroup-free
    target identity neighborhood forces an open kernel, without source
    compactness, commutativity or target separation. An open kernel makes a
    group homomorphism locally constant even without continuity or a target
    topology. With compact source, the image and kernel quotient are finite,
    the quotient is discrete, and Mathlib's canonical kernel lift uniquely
    factors the map. Circle's centered half-arc gives the character case.

    In a compact Hausdorff commutative topological group with an abstractly
    finitely generated dense subgroup, every positive-power range has finite
    index and is open. Every abstract finite-index subgroup is open without
    assuming it closed; the additive versions use natural-number scalars.

    In a locally compact topological group, the identity component is the
    intersection of all open subgroups. Under a continuous open surjective
    group homomorphism from a locally compact source, the closure of its
    identity-component image equals the target identity component. Neither
    result requires Hausdorffness of the original groups.

    An open quotient map from a compact Hausdorff totally disconnected space
    to a Hausdorff space has totally disconnected target, without group
    structure, injectivity or a local-compactness assumption on the target.
    An open quotient group homomorphism from a locally compact totally
    disconnected group to a Hausdorff group has the same conclusion.

    The compact-open space of continuous maps from any compact space to a
    discrete space is discrete, without Hausdorffness or nonemptiness. Every
    discrete-valued continuous map on a compact topological group descends
    through an open normal subgroup to its finite discrete quotient, without
    total disconnectedness, commutativity or a homomorphism condition.
    On an arbitrary power I → G of a compact topological group, every such map
    factors through s → G / N for a finite set s of coordinates and one open
    normal subgroup N of G. Only this selected stage is asserted to be finite
    and discrete, not the full quotient power over I. The index, group and
    target universes are independent. No finiteness of I or Y, algebraic
    structure on Y, additional nonemptiness, Hausdorffness or profinite
    hypothesis is needed.

    Every open normal subgroup of a dependent product of groups with arbitrary
    topologies contains a cylinder defined by open normal subgroups in finitely
    many factors. For a constant family, one subgroup controls all selected
    coordinates; the remaining coordinates are unrestricted. These containment
    statements need no continuity of operations, compactness, separation or
    finiteness of the index type.

    Every continuous group homomorphism from an arbitrary dependent product of
    groups equipped with topologies to a discrete group factors through open
    normal quotients of finitely many coordinates. Each selected canonical
    quotient and their product are discrete. Source operations need not be
    continuous; neither the index nor target needs to be finite. Compact factors
    make these selected quotients and their product finite. The canonical selected
    projection needs only normal subgroups and has an application, kernel,
    surjectivity and monoid-target unique descent API, the latter conditional on
    the projection being a quotient map.

    For any category and monoid-valued diagram with arbitrary stage topologies,
    compatible sections have continuous coordinate projections and an initial
    topology. Compatible continuous monoid homomorphisms from any monoid equipped
    with a topology lift uniquely to sections and form an equivalent family API;
    group diagrams have a continuous projection extending the algebraic one.

    An exactness criterion for the finite cyclic norm of an endomorphism of
    an additive commutative group, requiring a positive natural period m with
    sigma^m = 1 (not necessarily exact order), injective multiplication by
    that same m, and elementwise lifting of fixed classes modulo mA.

    For an arbitrary subgroup H of a group G with a supplied topology and
    continuous fixed left translations (ContinuousConstSMul G G), openness is
    equivalent to discreteness of the canonical left-coset quotient G / H,
    and closedness is equivalent to its T1 property. Clopenness is equivalent
    to openness without an index assumption. At finite index, openness,
    closedness and clopenness are equivalent, without compactness. Compactness
    is needed only to deduce finite index from openness. No normality, right
    continuity, joint multiplication, continuous inversion or ambient separation
    is required. The existing quotient and coinduced topology are unchanged.

    For any group G and arbitrary subgroups H and K, the canonical left-coset
    G-sets G / H and G / K are isomorphic exactly when H and K are conjugate.
    An equality H = gKg⁻¹ gives right translation [z] ↦ [z * g], with inverse
    [z] ↦ [z * g⁻¹]. No finiteness, normality or topological assumption is needed.

    For finitely generated abelian groups, surjectivity of the
    n-scalar map with n ≥ 2 forces finiteness and coprimality with Nat.card A
    and yields a uniform two-sided integer-scalar inverse; the converse
    characterizes surjectivity and bijectivity of that scalar map.

    For two representations of a monoid over a semiring on their given additive
    commutative monoid modules, the fixed submodule of the stock product is the
    literal product of the fixed submodules. A canonical linear equivalence
    splits coordinates and is natural in two supplied intertwining maps. It
    uses one representation-independent submodule-product splitting equivalence.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: Cohomology of Number Fields
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: >-
      Corrected second edition, electronic version 2.3, Chapter I, §1,
      (1.1.9)(i),(iii) and the preceding paragraph.
    note: >-
      The identity-component quotient API interprets and generalizes the
      totally disconnected quotient, without local compactness or separation
      of the source group. The continuous universal property is not a claim
      of the source's full open-normal-intersection characterization.
      The construction reuses Mathlib's component, quotient and topology APIs.
      The compact-open subgroup result is the classical van Dantzig theorem,
      used as a prerequisite in this context. Its proof uses Mathlib's
      compact-neighborhood, clopen-basis and subgroup APIs; the cited original
      Pontryagin and Bourbaki passages were not inspected. The locally compact
      identity-component intersection ranges over all open subgroups, rather
      than the false printed open-normal intersection. For component images,
      openness corrects the false merely-continuous surjection statement;
      closure remains necessary.
  - title: Cohomology of Number Fields, compact totally disconnected characters
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: >-
      Corrected second edition, Chapter I, §1, remarks following
      Theorem (1.1.11).
    note: >-
      The open-kernel and finite-image results generalize the character
      assertion to nonarchimedean, not necessarily abelian source groups;
      compactness is needed only for finite image and quotient. They use
      Mathlib's open-subgroup, locally constant and quotient APIs. This entry
      asserts neither a comparison with abstract characters nor formal
      coverage of the source.
  - title: Continuous compatible sections of monoid-valued diagrams
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: GroupTheory/Topology/Sections.lean, MonCat.sectionsHomEquiv
    note: >-
      Original Lean construction using Mathlib's compatible-sections carrier
      and product/subtype topology; no external source-coverage claim.
  - title: Products of fixed submodules on the original modules
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: >-
      GroupTheory/LinearAlgebra/Prod.lean, Submodule.prodEquiv;
      GroupTheory/RepresentationInvariants.lean,
      Representation.fixedSubmodule_prod and Representation.fixedSubmoduleProdEquiv
    note: >-
      The construction reuses Mathlib's submodule products, induced product
      modules, stock product representation, public intertwining projections,
      composition and pairing, and LinearEquiv.ofEq, together with this library's
      existing fixedSubmodule and fixedSubmoduleMap API. The generic splitting
      is separate from the representation layer. The original semiring, monoid,
      factor modules and their independent universes are preserved; the two target
      module universes in naturality are independent as well. The stronger-context
      invariants identity uses the existing same-data bridge to Mathlib's invariants.
      No particular external publication or source-coverage claim is asserted.
  - title: Finite cyclic norm exactness from fixed-class lifting
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: GroupTheory/CyclicNorm.lean, AddMonoid.End.cyclicNorm_ker_eq_one_sub_range
    note: >-
      Original Lean proof; no particular paper is claimed as the source, and
      this entry does not assert formal coverage of an external source.
  - title: Surjective natural scalars on finitely generated abelian groups
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: GroupTheory/FGScalarSurjectivity.lean, AddCommGroup.finite_coprime_of_nsmul_surjective
    note: >-
      Original generic Lean proof and derived inverse/iff results; mathematical
      motivation is not a claim of formal coverage of an external source.

  - title: Compact-open discreteness and compact-group finite-quotient factorization
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: >-
      GroupTheory/Topology/ContinuousMap/CompactDiscrete.lean,
      GroupTheory/Topology/Algebra/CompactGroup/DiscreteFactor.lean,
      GroupTheory/Topology/Algebra/OpenSubgroup/Pi.lean and
      GroupTheory/Topology/Algebra/CompactGroup/PiDiscreteFactor.lean
    note: >-
      The compact-open discreteness and unary factorization proofs were first
      formalized in Formal Frontier's Continuous Group Cohomology library,
      preserving the public theorem names and generality. They use Mathlib's
      compact-open subbasic sets, compact fibers, clopen identity neighborhoods
      and continuous quotient elimination. The finite-coordinate extension
      reuses the unary factorization, finite-supported product neighborhoods,
      finite intersections of open subgroups and products of open quotient maps.
      The cylinder argument uses Monica Omar's Mathlib product-membership API,
      in particular Submonoid.pi_mem_of_mulSingle_mem_aux. No particular external
      publication or source-coverage claim is asserted for these formalizations.

  - title: Finite-coordinate factorization of continuous group homomorphisms
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: GroupTheory/Topology/Algebra/Group/PiDiscreteFactor.lean
    note: >-
      The canonical projection and continuous descent reuse Mathlib's algebraic
      quotient, kernel-equivalence and quotient-map APIs. The proof combines the
      finite-cylinder containment and supported-part/tail argument with exact
      coordinate kernels, continuous injective kernel lifts and intrinsic quotient
      discreteness. Monica Omar's finite-supported product-membership API supplies
      the noncommutative subgroup argument. Compactness enters only through the
      compact-discrete finiteness theorem. No particular external publication or
      source-coverage claim is asserted.

  - title: Open, closed and clopen subgroups and canonical left-coset quotients
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: GroupTheory/Topology/Algebra/Group/Quotient.lean
    note: >-
      The proof terms compose Mathlib's canonical left-coset singleton fibers,
      coinducing projection, IsOpen.smul, IsClosed.smul, finite-T1 discreteness,
      compact-discrete finiteness and finite-index API. They generalize the
      separately continuous quotient-discreteness, quotient-T1, open-subgroup
      closedness, closed finite-index openness and compact open-subgroup
      finiteness results. The clients contain same-object agreement lemmas
      under those stronger hypotheses.
      Their first example is cofinite integers times discrete permutations of
      three points. A second example induces the permutation topology from the
      canonical left-coset projection to an explicitly discrete auxiliary
      target, without reading the dependent coinduced quotient topology as
      input. Supporting terms
      cover strict failure of right translations, inversion and joint
      multiplication, and the infinite compact product with a clopen proper
      nonnormal index-three subgroup. Closedness and finite index are supplied
      independently, using a closed auxiliary singleton and algebraic index
      three, so the closed/T1 and finite-index open/clopen APIs apply to the
      finite and infinite strict examples.
      No source paper or book passage was inspected for these additions, and
      no external-source correspondence or coverage is claimed.

automation:
  methods:
    - method: agent
      tool_setup: Formal Frontier AI agents using Lean 4 and mathlib.

status:
  scope: >-
    For any topological group G, the ordinary quotient by its identity
    component is Hausdorff and totally disconnected. G need not be Hausdorff
    or locally compact. The canonical projection is continuous, and every
    continuous homomorphism from G to a totally disconnected group equipped
    with a topology factors uniquely through it, without continuity of the
    target operations. The API includes composition and hom-equivalence laws.
    Hausdorffness uses Mathlib's existing closed-normal quotient instances,
    not a separate library theorem. The locally compact identity-component
    characterization uses all open subgroups, not the false intersection of
    open normal subgroups. Under continuous open surjective homomorphisms from
    locally compact sources, the closure of the component image is the target
    component; the target need not be separately Hausdorff or locally compact.

    Every identity neighborhood W in a locally compact totally disconnected
    topological group contains a compact open subgroup lying in W, without
    assuming W is open or separately assuming the group is Hausdorff. Compact
    open subgroups form an identity-neighborhood basis. For any compact open
    set K, its open left-translation stabilizer consists precisely of the
    group elements g with g • K = K; when 1 ∈ K this stabilizer is compact
    and contained in K. The stabilizer construction does not need local
    compactness, total disconnectedness or identity membership in K. In a
    compact ambient group the compactness refinement is equivalent to the
    existing open-subgroup existence conclusion of Mathlib. This does not
    assert an open-normal-intersection characterization of the quotient.

    A continuous homomorphism from a nonarchimedean group to a group with an
    identity neighborhood containing no nontrivial subgroup has open kernel,
    without source compactness, commutativity or target Hausdorffness.
    Open kernels imply local constancy without homomorphism continuity or a
    target topology. Compact source gives finite image and a finite discrete
    quotient by the kernel. The canonical kernel lift factors the map uniquely;
    it is injective, not necessarily surjective onto the whole target. The
    centered half-circle yields circle-valued characters, including the
    locally compact totally disconnected case via compact-open subgroups.
    The cyclic group of order two supplies a nonconstant character client.

    A compact Hausdorff commutative group with an abstractly finitely generated
    dense subgroup has finite-index open positive-power ranges; all abstract
    finite-index subgroups are open, without a closedness hypothesis. The
    additive 2-adic integers provide a dense integer subgroup, an open
    finite-index doubling range and a proper finite-index reduction kernel.
    Their zero-scalar range has infinite index, so positivity is necessary.

    For an open quotient map f : X → Y, with X compact, Hausdorff and totally
    disconnected and Y Hausdorff, Y is totally disconnected. No group structure,
    injectivity or local-compactness assumption on Y is needed. The proof follows
    the existing Formal Frontier Profinite Groups formalization and uses Mathlib's
    clopen-basis and open-quotient APIs.

    For any compact space X and discrete space Y, the existing compact-open
    topology on C(X, Y) is discrete; this is a theorem, not a global instance.
    For any compact topological group G and f : C(G, Y), there exist an open
    normal subgroup N and a continuous map fbar on G / N with
    fbar(QuotientGroup.mk g) = f g for every g. Mathlib's open-subgroup quotient
    APIs make the quotient finite and discrete. Neither theorem requires a
    Hausdorff or nonempty space; factorization needs no total disconnectedness,
    commutativity or algebraic structure on Y. Clients derive right invariance
    and quotient-point separation and include a nonconstant Boolean-valued map.

    For arbitrary I, compact topological group G and discrete space Y, with
    their types in independent universes, every f : C(I → G, Y) admits
    s : Finset I, N : OpenNormalSubgroup G and
    fbar : C((s → G ⧸ N.toSubgroup), Y) satisfying the canonical triangle
    ∀ x : I → G, fbar (fun i : s => QuotientGroup.mk (x i)) = f x.
    The product and group-quotient topologies are canonical. The selected stage
    s → G ⧸ N.toSubgroup is finite and discrete; no such assertion is made for
    the full quotient power over an infinite I. The selected set may be empty,
    and neither I nor Y needs to be finite. No additional nonemptiness,
    Hausdorffness, total disconnectedness, commutativity or profinite hypothesis
    is required. Y has no algebraic-structure requirement and f need not be a
    homomorphism. The power clients include a two-coordinate Boolean observer
    that cannot be a homomorphism under any group structure on Bool, an
    infinite-index observer with an infinite discrete target, and empty-index,
    empty-target and constant-map boundaries.

    The finite-cylinder theorem applies to M : OpenNormalSubgroup (∀ i, A i)
    for arbitrary I and a family A with only [∀ i, Group (A i)] and
    [∀ i, TopologicalSpace (A i)]. It gives s : Finset I and
    N : ∀ i : s, OpenNormalSubgroup (A i) with
    ∀ x : (∀ i, A i), (∀ i : s, x i ∈ N i) → x ∈ M.
    For a constant family it gives one N : OpenNormalSubgroup G with
    ∀ x : I → G, (∀ i : s, x i ∈ N) → x ∈ M.
    Coordinates outside s are unrestricted. Neither containment statement
    assumes continuous group operations, compactness, separation or a finite
    index type. The power factorization reuses the unary factorization with
    this uniform cylinder and continuous quotient descent.

    For arbitrary dependent groups G i with topologies and a discrete group H,
    every continuous homomorphism from the product to H factors through
    quotients of finitely many coordinates by open normal subgroups. The
    factor is itself a continuous group homomorphism, with a bundled triangle
    through the canonical selected projection. Each selected quotient and the
    product stage are intrinsically discrete in their canonical topologies.
    Source operations need not be continuous, and no compactness, separation,
    commutativity, finite index or finite target is assumed. The descended
    homomorphism need not be injective, and the stage may be infinite. Compact
    factors give finite coordinate quotients and finite stage. The normality-only
    projection has application, kernel and surjectivity lemmas; its monoid-target
    universal property assumes it is a quotient map. Clients have genuinely
    essential and heterogeneous coordinates, noninjective factors, arbitrary
    ignored topologies and a surjective infinite integer observer ruling out a
    finite stage, together with empty, trivial and nonopen normal boundaries.

    For any category J and F : J ⥤ MonCat with arbitrary topologies on the
    stages, Mathlib's existing compatible-sections subtype has continuous
    coordinate projections and the initial topology induced by its coordinates.
    Continuous monoid homomorphisms from any monoid H equipped with an arbitrary
    topology lift uniquely from families compatible along every arrow; these
    families are equivalent to continuous homomorphisms into the sections.
    For group diagrams, the continuous monoid-homomorphism projection recovers
    Mathlib's algebraic projection on forgetting continuity. The topology is
    inherited from the product/subtype construction; no new sections carrier
    or group lift is defined. No continuity of operations or transitions,
    smallness, inhabitance, cofilteredness, separation, compactness or
    surjectivity of projections is assumed. This is not a TopCat limit,
    topological-group theorem or additive API, and makes no claim of formal
    coverage of an external source.

    For an endomorphism sigma of an additive commutative group, a natural
    m > 0 with sigma^m = 1 (not necessarily exact order), injective
    multiplication by the same m, and elementwise fixed-class lifting
    modulo mA imply ker(∑_{i<m} sigma^i) = range(1 - sigma). The lifting is
    elementwise, not a global section. Client examples include failure
    boundaries; no unconditional Tate or cohomology theorem is asserted.

    Subgroup.isClosed_iff_t1Space_quotient characterizes closed H by T1 of
    the canonical left-coset quotient, and Subgroup.isClopen_iff_isOpen
    characterizes clopen H by openness, with no index assumption.
    Subgroup.isOpen_iff_isClosed and Subgroup.isClopen_iff_isClosed require
    H.FiniteIndex and identify openness, closedness and clopenness.
    These and the open/discrete characterization use Group, a supplied topology
    and continuous fixed left translations (ContinuousConstSMul G G), without
    compactness. Only the separate open-to-finite-index corollary needs
    CompactSpace G. None imposes normality, right continuity, joint
    multiplication, inversion continuity or ambient separation. The canonical
    quotient and coinduced topology are unchanged. An arbitrary observer from
    the quotient of a closed finite-index subgroup to any space is continuous,
    with no explicit openness or compactness premise. The client module includes
    both a cofinite-integer times discrete-permutation example and a stricter
    example with partition-topologized permutations, induced from an explicitly
    discrete auxiliary left-coset target. The latter and its infinite compact
    product have continuous left translations but fail the all-right condition,
    separate continuity, inversion and T0/T1/T2; independent closedness and
    algebraic index-three witnesses supply the new API's premises.

    Action.nonempty_quotient_iso_iff_exists_eq_map_conj characterizes isomorphisms
    between Action.ofMulAction G (G ⧸ H) and Action.ofMulAction G (G ⧸ K) by
    an equality H = K.map (MulAut.conj g).toMonoidHom for some g : G.
    Only Group G and arbitrary subgroups H and K are required. The controlled
    constructor Action.quotientIsoOfEqMapConj has forward formula [z] ↦ [z * g]
    and inverse formula [z] ↦ [z * g⁻¹]; its hom_mk, inv_mk and hom_one lemmas
    characterize these maps. The identity coset maps to the coset of g, not
    a unique representative. Both maps use MulActionHom.quotientEquivFixedPoints;
    Mathlib's Action.mkIso supplies the categorical isomorphism.
    This criterion concerns the canonical left-coset actions, not merely
    equivariant maps in both directions or arbitrary infinite endomaps.

    For any group G and arbitrary subgroups H and K, the orbit quotient of
    the canonical single-G diagonal left action on (G / H) × (G / K) is
    equivalent to DoubleCoset.Quotient (H : Set G) (K : Set G). The forward
    formula is orbit(xH, yK) ↦ H (x⁻¹ * y) K; the inverse is H g K ↦ orbit(H, gK).
    Both have simp projection lemmas, and equality of pair orbits is equivalent
    to x'⁻¹ * y' = h * (x⁻¹ * y) * k for some h ∈ H and k ∈ K. No finiteness,
    normality or topological assumption is required.

    For [AddGroup.FG A] on an additive commutative group and natural n ≥ 2,
    surjectivity of the map x ↦ n • x implies finite A, coprimality
    of n with Nat.card A and a uniform two-sided integer-scalar inverse.
    Finiteness and coprimality also characterize scalar surjectivity and
    bijectivity. This is neither a K-theory theorem nor a theorem about
    arbitrary surjective endomorphisms or external-source coverage.

    Fixed submodules commute with the stock product representation over a semiring
    and a monoid, on the original additive commutative monoid modules. The literal
    submodule equality yields a linear equivalence by equality transport and the
    generic Submodule.prodEquiv. Coordinate and inverse formulas, inclusion and
    restricted-projection identities, and naturality for a pair of supplied
    intertwining maps characterize it. No product-intertwiner wrapper, alternate
    carrier or compatibility premise is introduced. In the commutative-ring,
    group, additive-group context, invariants_prod follows on the same data.
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
