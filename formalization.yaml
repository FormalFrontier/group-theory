status:
  scope: >-
    For any topological group G, the ordinary quotient by its identity
    component is Hausdorff and totally disconnected. G need not be Hausdorff
    or locally compact. The canonical projection is continuous, and every
    continuous homomorphism from G to a totally disconnected group equipped
    with a topology factors uniquely through it, without continuity of the
    target operations. The API includes composition and hom-equivalence laws.
    Hausdorffness uses Mathlib's existing closed-normal quotient instances,
    not a separate library theorem. The locally compact identity-component
    characterization uses all open subgroups, not the false intersection of
    open normal subgroups. Under continuous open surjective homomorphisms from
    locally compact sources, the closure of the component image is the target
    component; the target need not be separately Hausdorff or locally compact.

    Every identity neighborhood W in a locally compact totally disconnected
    topological group contains a compact open subgroup lying in W, without
    assuming W is open or separately assuming the group is Hausdorff. Compact
    open subgroups form an identity-neighborhood basis. For any compact open
    set K, its open left-translation stabilizer consists precisely of the
    group elements g with g • K = K; when 1 ∈ K this stabilizer is compact
    and contained in K. The stabilizer construction does not need local
    compactness, total disconnectedness or identity membership in K. In a
    compact ambient group the compactness refinement is equivalent to the
    existing open-subgroup existence conclusion of Mathlib. This does not
    assert an open-normal-intersection characterization of the quotient.

    A continuous homomorphism from a nonarchimedean group to a group with an
    identity neighborhood containing no nontrivial subgroup has open kernel,
    without source compactness, commutativity or target Hausdorffness.
    Open kernels imply local constancy without homomorphism continuity or a
    target topology. Compact source gives finite image and a finite discrete
    quotient by the kernel. The canonical kernel lift factors the map uniquely;
    it is injective, not necessarily surjective onto the whole target. The
    centered half-circle yields circle-valued characters, including the
    locally compact totally disconnected case via compact-open subgroups.
    The cyclic group of order two supplies a nonconstant character client.

    A compact Hausdorff commutative group with an abstractly finitely generated
    dense subgroup has finite-index open positive-power ranges; all abstract
    finite-index subgroups are open, without a closedness hypothesis. The
    additive 2-adic integers provide a dense integer subgroup, an open
    finite-index doubling range and a proper finite-index reduction kernel.
    Their zero-scalar range has infinite index, so positivity is necessary.

    For an open quotient map f : X → Y, with X compact, Hausdorff and totally
    disconnected and Y Hausdorff, Y is totally disconnected. No group structure,
    injectivity or local-compactness assumption on Y is needed. The proof follows
    the existing Formal Frontier Profinite Groups formalization and uses Mathlib's
    clopen-basis and open-quotient APIs.

    For any category J and F : J ⥤ MonCat with arbitrary topologies on the
    stages, Mathlib's existing compatible-sections subtype has continuous
    coordinate projections and the initial topology induced by its coordinates.
    Continuous monoid homomorphisms from any monoid H equipped with an arbitrary
    topology lift uniquely from families compatible along every arrow; these
    families are equivalent to continuous homomorphisms into the sections.
    For group diagrams, the continuous monoid-homomorphism projection recovers
    Mathlib's algebraic projection on forgetting continuity. The topology is
    inherited from the product/subtype construction; no new sections carrier
    or group lift is defined. No continuity of operations or transitions,
    smallness, inhabitance, cofilteredness, separation, compactness or
    surjectivity of projections is assumed. This is not a TopCat limit,
    topological-group theorem or additive API, and makes no claim of formal
    coverage of an external source.

    For an endomorphism sigma of an additive commutative group, a natural
    m > 0 with sigma^m = 1 (not necessarily exact order), injective
    multiplication by the same m, and elementwise fixed-class lifting
    modulo mA imply ker(∑_{i<m} sigma^i) = range(1 - sigma). The lifting is
    elementwise, not a global section. Client examples include failure
    boundaries; no unconditional Tate or cohomology theorem is asserted.

    For [AddGroup.FG A] on an additive commutative group and natural n ≥ 2,
    surjectivity of the map x ↦ n • x implies finite A, coprimality
    of n with Nat.card A and a uniform two-sided integer-scalar inverse.
    Finiteness and coprimality also characterize scalar surjectivity and
    bijectivity. This is neither a K-theory theorem nor a theorem about
    arbitrary surjective endomorphisms or external-source coverage.
