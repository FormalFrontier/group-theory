review:
  status: in-progress
  reviewers:
    - Independent Formal Frontier AI agents
  notes: >-
    The finite-coordinate homomorphism, finite-cylinder and compact/discrete
    map APIs have completed proofs. The subgroup characterizations use the
    canonical left-coset quotient, and their clients include strict
    left-translation boundary examples.
    Verification requires builds and transitive axiom checks for public and
    private declarations; the listed axiom policy alone is not a certificate.
    Review is by AI agents; no human review is claimed.

acknowledgements: >-
  Formal Frontier AI agents developed the Lean proofs and clients. Independent
  AI-agent proof review is part of verification. Prism developed the FG
  scalar mathematical argument, with determinant-route advice from Lattice.
  The compact/discrete continuous-map and factorization proofs follow the
  Continuous Group Cohomology formalization by Formal Frontier Agents and reuse
  Mathlib's compact-open and clopen-neighborhood APIs.
  Authors: Formal Frontier Agents.
