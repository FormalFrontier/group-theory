name = "groupTheory"
version = "0.1.0"
defaultTargets = ["GroupTheory", "GroupTheoryTest"]
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "homological_algebra"
git = "https://github.com/FormalFrontier/homological-algebra.git"
rev = "1ecd25213926138278dbd661bd516de9135d944a"

[[lean_lib]]
name = "GroupTheory"
roots = [
  "GroupTheory",
  "GroupTheory.Topology.LocallyConstant",
  "GroupTheory.Topology.PontryaginDual.Discrete",
  "GroupTheory.Topology.Separation.Finite",
  "GroupTheory.Topology.Algebra.Group.Subsemigroup",
  "GroupTheory.Algebra.IsAddUnit",
  "GroupTheory.Algebra.Divisibility.Basic",
  "GroupTheory.Algebra.GroupWithZero.Nilpotent",
  "GroupTheory.Algebra.GroupWithZero.Pi",
  "GroupTheory.Algebra.Ring.Pi",
  "GroupTheory.Algebra.GroupWithZero.Reduced.List",
  "GroupTheory.Algebra.BigOperators.GroupWithZero.List",
  "GroupTheory.Algebra.Polynomial.Units",
  "GroupTheory.Ring.Nilpotent.Finset",
  "GroupTheory.Ring.Power.Finset",
  "GroupTheory.Algebra.Module.RationalCircle"
]

[[lean_lib]]
name = "GroupTheoryTest"
roots = [
  "GroupTheoryTest",
  "GroupTheoryTest.Algebra.Divisibility.Basic",
  "GroupTheoryTest.Algebra.GroupWithZero.Pi",
  "GroupTheoryTest.Algebra.Ring.Pi",
  "GroupTheoryTest.GroupAction.CentralizerTransitivity",
  "GroupTheoryTest.GroupAction.FiniteKernelQuotient",
  "GroupTheoryTest.Topology.Algebra.Group.PiQuotientSimp",
  "GroupTheoryTest.Topology.GroupAction.FiniteOrbit",
  "GroupTheoryTest.Topology.Algebra.Group.Constructible",
  "GroupTheoryTest.Topology.Algebra.Group.FiniteComponents",
  "GroupTheoryTest.Topology.Algebra.Group.NoetherianSubsemigroup"
]
leanOptions.weak.linter.privateModule = false
