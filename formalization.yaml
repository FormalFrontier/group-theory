version: "v0.4"

project:
  name: Group Theory
  description: >-
    A finite cyclic norm exactness criterion: ker(∑_{i<m} σ^i) = range(1 - σ)
    for an additive commutative group and endomorphism σ, with a natural number
    m > 0 satisfying σ^m = 1 (not necessarily exact order), injectivity of
    multiplication by this same m, and elementwise lifting of fixed classes
    modulo mA.

    For finitely generated abelian groups, surjectivity of the actual n-scalar
    map with n ≥ 2 forces finiteness, coprimality of n with the group order,
    and a uniform two-sided integer-scalar inverse. The converse criteria
    characterize actual scalar surjectivity and bijectivity.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: Finite cyclic norm exactness from fixed-class lifting
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: GroupTheory/CyclicNorm.lean, AddMonoid.End.cyclicNorm_ker_eq_one_sub_range
    note: >-
      Original Lean proof; no particular paper is claimed as the source, and
      this entry does not assert formal coverage of an external source.
  - title: Surjective natural scalars on finitely generated abelian groups
    authors:
      - Formal Frontier Agents
    type: original-proof
    location: GroupTheory/FGScalarSurjectivity.lean, AddCommGroup.finite_coprime_of_nsmul_surjective
    note: >-
      Original generic Lean proof and derived inverse/iff results; mathematical
      motivation is not a claim of formal coverage of an external source.

automation:
  methods:
    - method: agent
      tool_setup: Formal Frontier AI agents using Hive Tasks, Lean 4 and mathlib.

status:
  scope: >-
    An exactness criterion for an endomorphism σ of an additive commutative
    group, for a natural m > 0 with σ^m = 1, injective multiplication by that
    same m, and elementwise lifting of fixed classes modulo mA. The period m
    need not be the exact order of σ. Representative client examples and
    counterexamples are included; no Tate or cohomology development is included.

    Separately, on an additive commutative finitely generated group and a
    natural n ≥ 2, actual n-scalar surjectivity implies finiteness,
    coprimality of n with Nat.card A, and a uniform two-sided integer inverse.
    The two equivalences characterize actual scalar surjectivity and
    bijectivity, with zero and nonzero finite client examples. This does not
    formalize a K-theory statement or arbitrary endomorphisms.
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: AddMonoid.End.cyclicNorm_ker_eq_one_sub_range
      file: GroupTheory/CyclicNorm.lean
    - declaration: AddCommGroup.exists_zsmul_inverse_of_nsmul_surjective
      file: GroupTheory/FGScalarSurjectivity.lean
    - declaration: AddCommGroup.finite_coprime_of_nsmul_surjective
      file: GroupTheory/FGScalarSurjectivity.lean
    - declaration: AddCommGroup.nsmul_surjective_iff_finite_coprime
      file: GroupTheory/FGScalarSurjectivity.lean
    - declaration: AddCommGroup.nsmul_bijective_iff_finite_coprime
      file: GroupTheory/FGScalarSurjectivity.lean

